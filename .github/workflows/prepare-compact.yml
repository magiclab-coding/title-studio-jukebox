name: Prepare compact template cards
on:
  push:
    branches: [feature/20261117-compact-template-cards]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run format
      - name: Save prepared sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html src/style.css tests/designer-browser.mjs package.json package-lock.json CHANGELOG.md AGENTS.md
          if ! git diff --cached --quiet; then
            git commit -m "Format compact template cards"
            git push origin HEAD:feature/20261117-compact-template-cards
          fi
