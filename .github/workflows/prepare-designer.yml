name: Prepare template designer
on:
  push:
    branches: [feature/20261117-template-designer]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm install --save-dev --save-exact playwright@1.56.1
      - run: npm ci
      - name: Readable editor template
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { format } from 'prettier';
          const path = 'src/designer.js';
          let source = await readFile(path, 'utf8');
          for (const match of [...source.matchAll(/template: `([\s\S]*?)`/g)]) {
            const html = await format(match[1], { parser: 'vue', printWidth: 100 });
            source = source.replace(match[0], 'template: `\n' + html.trim().split('\n').map(line => '    ' + line).join('\n') + '\n  `');
          }
          await writeFile(path, source);
          NODE
      - run: npm run format
      - run: npm run format
      - name: Save readable sources and lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src build.mjs tests package.json package-lock.json README.md CHANGELOG.md docs .github/workflows/ci.yml .gitignore .prettierignore
          if ! git diff --cached --quiet; then
            git commit -m "Format template designer and lock browser tests"
            git push origin HEAD:feature/20261117-template-designer
          fi
      - run: npm test
      - run: node --test tests/release-version.mjs
      - run: npm run build
      - run: npm run test:build
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-designer-browser
          path: .test-artifacts/
          if-no-files-found: ignore
      - name: Inspect mobile preview
        if: always()
        run: |
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; try { console.log("DESIGNER_CAPTURE:" + (await readFile(".test-artifacts/designer-360.png")).toString("base64")); } catch {}'
