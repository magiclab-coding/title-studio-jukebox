name: Prepare template edit icons
on:
  push:
    branches: [feature/20261117-template-edit-icons]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Save readable sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html src/style.css tests/designer-browser.mjs package.json package-lock.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Format template edit controls"
            git push origin HEAD:feature/20261117-template-edit-icons
          fi
      - run: npm test
      - run: node --test tests/release-version.mjs
      - run: npm run build
      - run: npm run test:build
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
