name: Prepare typewriter fonts
on:
  push:
    branches: [feature/20261117-typewriter-fonts]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm install --save-exact @fontsource/courier-prime @fontsource/cutive-mono @fontsource/special-elite @fontsource/ibm-plex-mono
      - run: npm ci
      - run: npm run format
      - name: Save readable sources and locked fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js scripts/build-fonts.mjs tests/build.mjs tests/designer-browser.mjs package.json package-lock.json README.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Lock typewriter fonts and format sources"
            git push origin HEAD:feature/20261117-typewriter-fonts
          fi
      - run: npm test
      - run: node --test tests/release-version.mjs
      - run: npm run build
      - run: npm run test:build
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typewriter-browser
          path: .test-artifacts/
          if-no-files-found: ignore
