name: CI
# Valida PR listas para revisar y el resultado integrado en develop.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
permissions:
  contents: read
# Una nueva revisión sustituye la validación anterior del mismo evento.
# Las publicaciones usan su propia concurrencia y nunca se cancelan aquí.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    # Un borrador puede prepararse sin generar errores de formato prematuros.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    # Coincide con Playwright en package-lock e incluye navegador y dependencias.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check branch flow
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        run: node scripts/check-flow.mjs
      # Formato, comportamiento y compilación se comprueban sobre la misma revisión.
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: node --test tests/release-version.mjs
      - run: npm run build
      - run: npm run test:build
      # El editor se prueba sobre dist y en tres anchuras de pantalla.
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-designer-browser
          path: .test-artifacts/
          if-no-files-found: ignore
