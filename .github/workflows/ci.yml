name: CI
# Valida ramas de trabajo y PR antes de integrar cambios.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, 'feature/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check branch flow
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        run: node scripts/check-flow.mjs
      # Formato, comportamiento y compilación se comprueban sobre la misma revisión.
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: node --test tests/release-version.mjs
      - run: npm run build
