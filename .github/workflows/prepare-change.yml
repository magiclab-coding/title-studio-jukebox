name: Prepare inline restore release
on:
  push:
    branches: [feature/20261117-restore-input-release]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Save readable formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/style.css src/components.js package.json package-lock.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Format inline restore release"
            git push origin HEAD:feature/20261117-restore-input-release
          fi
      - run: npm test
      - run: node --test tests/release-version.mjs
      - run: npm run build
      - run: npm run test:build
      - run: npm run format:check
