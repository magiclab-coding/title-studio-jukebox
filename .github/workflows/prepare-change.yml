name: Prepare annotated change
on:
  push:
    branches: [feature/20261117-001000-integrated-label-edit]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      # Commit only formatting; no generated output or workflow changes.
      - name: Save readable source formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/components.js src/index.html src/style.css tests/studio.mjs AGENTS.md docs/MODELO_DE_DATOS.md package.json package-lock.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Format integrated label editing"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - run: npm test
      - run: node --test tests/release-version.mjs
      - run: npm run build
      - run: npm run test:build
      - run: npm run format:check
