name: Prepare repository cleanup
on:
  push:
    branches: [feature/20261117-010000-remove-obsolete-archive]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Save readable formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md CHANGELOG.md .prettierignore docs src scripts tests package.json package-lock.json .github/workflows/release-pages.yml
          if ! git diff --cached --quiet; then
            git commit -m "Format repository cleanup"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - run: npm test
      - run: node --test tests/release-version.mjs
      - run: npm run build
      - run: npm run test:build
      - run: npm run format:check
      - name: Remove verified imported publications
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/cleanup-once.mjs
